name: Backend CI

on:
  push:
    branches: [main, dev, 'repair/**', 'feature/**', 'release/**']
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install flake8==7.1.1

      - name: Run repository tests
        env:
          ENVIRONMENT: test
          DATABASE_URL: "sqlite:///:memory:"
        run: python -m pytest tests/ -v

      - name: Report NBA dataset readiness (non-blocking until real data sourced)
        run: python scripts/audit_basketball_data.py

      - name: Validate dashboard inline JavaScript
        run: python scripts/check_dashboard_js.py

      - name: Check for syntax and critical lint errors
        run: |
          python -m compileall -q main.py api services dashboard tests
          python -m compileall -q scripts/audit_basketball_data.py
          python -m compileall -q scripts/fixture_collection.py scripts/publish_daily_predictions.py scripts/refresh_booking_codes.py scripts/settle_results.py scripts/stage_weekly_training.py deploy/review_vps_conflicts.py
          bash -n deploy/audit_vps_baseline.sh deploy/install_fixture_timers.sh deploy/install_prediction_timers.sh deploy/install_booking_monitor_timer.sh deploy/install_settlement_timer.sh deploy/install_training_timer.sh deploy/preflight_dirty_vps.sh deploy/prepare_vps_reconciliation.sh
          python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
